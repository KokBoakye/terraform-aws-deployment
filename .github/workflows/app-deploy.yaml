name: Deploy - App

on:
    push:
        branches:
            - app
 

jobs:
    Docker-buil-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::604312263409:role/githubuser
                aws-region: eu-north-1

            - name: Authenticate to Amazon ECR
              run: |
                aws ecr get-login-password --region eu-north-1 \
                  | docker login --username AWS --password-stdin 604312263409.dkr.ecr.eu-north-1.amazonaws.com

            - name: Create ECR repos
              run: |
                for repo in myflaskapp mynginx; do
                  aws ecr describe-repositories --repository-names $repo --region eu-north-1 >/dev/null 2>&1 || \
                  aws ecr create-repository --repository-name $repo --region eu-north-1
                done 

            - name: Build Flask Docker image
              run: docker build -t myflaskapp ./App/flask_app

            - name: Build Nginx Docker image
              run: docker build -t mynginx ./App/flask_app/nginx

            - name: Tag & Push Flask
              run: |
                docker tag myflaskapp:latest 604312263409.dkr.ecr.eu-north-1.amazonaws.com/myflaskapp:latest
                docker push 604312263409.dkr.ecr.eu-north-1.amazonaws.com/myflaskapp:latest

            - name: Tag & Push Nginx
              run: |
                docker tag mynginx:latest 604312263409.dkr.ecr.eu-north-1.amazonaws.com/mynginx:latest
                docker push 604312263409.dkr.ecr.eu-north-1.amazonaws.com/mynginx:latest


        
            